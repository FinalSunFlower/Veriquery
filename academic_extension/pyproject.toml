[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "veriquery-academic-extension"
version = "0.1.0"
description = "Supplementary frozen-artifact audits for the VeriQuery preprint"
requires-python = ">=3.10"
dependencies = ["matplotlib>=3.7"]

[tool.pytest.ini_options]
testpaths = ["."]
